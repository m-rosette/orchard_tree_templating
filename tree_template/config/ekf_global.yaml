ekf_global:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.3
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: amiga__base
    world_frame: map

    publish_tf: true
    publish_acceleration: false

    # Fuse the local EKF output (smooth motion) as a baseline
    odom0: /odometry/local
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10

    # Fuse GPS-converted odometry for global x,y (and optionally yaw if you trust it)
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
