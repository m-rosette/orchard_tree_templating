navsat_transform:
  ros__parameters:
    frequency: 10.0
    delay: 0.0

    # Inputs
    gps_topic: /fix
    imu_topic: /imu/data
    odom_topic: /odometry/local

    # Output
    output_topic: /odometry/gps

    # false: heading from the IMU. true: heading from the odometry input.
    use_odometry_yaw: false

    # Magnetic declination and yaw offset of the IMU heading.
    magnetic_declination_radians: 0.0
    yaw_offset: 2.53   # [rad] aligns /odometry/gps with /odometry/local on the 2023 bags (the IMU yaw is not north-referenced)

