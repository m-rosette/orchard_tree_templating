# navsat_transform for ekf_fusion.launch.py mode:=gps_heading. Heading comes from /gps/course_imu (GPS course, ENU,
# 0 = east). Odometry input is /odometry/global. Fix input is /fix_rtk. The launch file sets these with remaps.
navsat_transform:
  ros__parameters:
    frequency: 10.0
    delay: 0.0
    gps_topic: /fix_rtk            # for reference only: ekf_fusion.launch.py sets the topics with remaps
    imu_topic: /gps/course_imu
    odom_topic: /odometry/global
    output_topic: /odometry/gps
    use_odometry_yaw: false
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
