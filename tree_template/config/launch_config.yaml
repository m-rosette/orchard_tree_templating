# tree_template/config/launch_config.yaml

trunk_detection_relay:
  ros__parameters:
    input_topic: tree_image_data
    camera_frame: base_camera_color_optical_frame
    output_frame: amiga__base
    output_topic: trunk_measurements_raw

    use_trunk_width_addition: true

    min_trunk_width: 0.03
    required_class: 0
    log_rejection_every_n_msgs: 3

    publish_debug_markers: true
    debug_marker_topic: trunk_measurements_raw_markers
    debug_marker_scale: 0.20


row_fast_slam:
  ros__parameters:
    num_particles: 1000
    measurement_topic: /trunk_measurements_raw
    odom_topic: /odometry/filtered
    registry_topic: fastslam_registry
    odom_best_topic: odom_slam_best

    # Slot initialization (map init)
    slot_spacing: 0.85
    num_slots: 60
    exceed_slot_num: true
    max_extra_slots: 20  
    row_origin_s: 0.0
    slot_s_gate: 0.6
    row_origin_x: .nan
    row_origin_y: .nan
    row_dir_sign: 1
    row_yaw_init_window: 35
    min_seen_count_to_publish: 1
    snap_downstream_spacing: false
    downstream_snap_mode: unseen_only
    use_template_map: true
    template_origin_from_first_measurement: true
    template_origin_min_hits: 5
    publish_unseen_template_landmarks: false
    use_global_row_yaw: true

    # Initial covariance - landmark uncertainty
    prior_sigma_s: 2.0
    prior_sigma_d: 1.0

    # Local trunk associations
    max_back_assoc: 0
    max_fwd_assoc: 2

    # Trunk row side classification
    start_side: near
    init_d_near: 0.0
    init_d_far: 0.0
    side_mode: semantic
    semantic_side_min_votes: 3
    semantic_side_fallback: fixed

    # Measurement distribution
    meas_std_y_lat: 2.0
    meas_std_x_fwd: 3.0

    # Motion distribution
    motion_noise.a_trans: 1.2
    motion_noise.b_trans: 0.3
    motion_noise.c_lat: 0.3
    motion_noise.a_rot: 0.1
    motion_noise.b_rot: 0.15

    # Resampling
    resample_interval: 10
    neff_ratio_threshold: 0.5

    # Median-particle innovation gate (Mahalanobis^2). Set <= 0 to disable.
    maha_gate_median: 0.0
    maha_gate_min_particles: 50

    # Landmark covariance floor (std dev in meters, world frame). Set <= 0 to disable a component.
    landmark_sigma_floor_x: 0.0
    landmark_sigma_floor_y: 0.0

    # FASTSLAM 2.0 - measurement-informed pose proposal
    proposal.enable: false
    proposal.min_pose_std_xy: 0.02
    proposal.min_pose_std_yaw: 0.06

    # Template soft prior (weight updates)
    template_prior.enable: true
    template_prior.sigma_s: 0.2
    template_prior.sigma_d: 0.1
    template_prior.decay_k: 1.2
    template_prior.max_seen: 100
    template_prior.w: 3.0

    # Message lag
    meas_max_lag_sec: 0.5
    odom_history_sec: 20.0

    # Debugging
    debug.csv_enable: true
    debug.log_every_n_meas: 0
    #debug.csv_path: /home/marcus/apple_harvest_ws/src/orchard_tree_templating/tree_template/debug_data/fastslam_debug.csv
    debug.csv_flush_every_n: 1
    debug.print_measurement_stamp: false

odom_reframer:
  ros__parameters:
    input_odom_topic: /odometry/filtered
    output_odom_topic: /odom
    odom_frame: odom
    base_frame: amiga__base
    publish_tf: true

    recenter: false

    rotate_pos_deg: 180.0
    rotate_yaw_deg: 0.0
    rotate_orientation_only: false

    use_now_stamp: false
    copy_twist: true

    gps_topic: /fix
    gps_min_status: 0
    gps_require_finite_cov: false

    initial_odom_samples: 30
    initial_gps_samples: 2

slam_odom_correction_tf:
  ros__parameters:
    wheel_odom_topic: /odom
    slam_odom_topic: /odom_slam_best

    odom_frame: odom
    map_frame: map

    sync_queue_size: 50
    sync_slop_sec: 0.05
    sync_allow_headerless: false

    publish_rate_hz: 30.0
    publish_on_wheel_odom: true


tree_scene_node:
  ros__parameters:
    leader_branch_radii: 0.08
    leader_branch_len: 2.0
    num_side_branches: 4.0
    side_branch_radii: 0.04
    side_branch_len: 2.0

    trellis_angle: -18.435
    branch_spacing: 0.5
    trellis_frame: map
    trellis_prefix: v_trellis_tree_

    registry_topic: fastslam_registry


save_best_particle_map:
  ros__parameters:
    trunk_topic: /fastslam_registry
    odom_corr_topic: /initial_odom_correction
    gps_topic: /initial_gps_fix
    final_gps_topic: /fix
    out: /home/marcus/trunk_width_ws/pf_localization_package_data/slam_measurements/slam_trunks.yaml

    require_odom_correction: true
    require_gps_fix: true
    require_trunks: true
    require_final_gps_fix: true

    service_name: save_slam_results