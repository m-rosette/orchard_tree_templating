# tree_template/config/launch_config_2025_with_polar_meas.yaml
# Algorithm tuning for the 2025 Prosser bags (Amiga).
# The robot config (config/robot/*.yaml) holds the robot and machine values: frames, sensor topics, output paths.
# trunk_to_template_pub.launch.py loads the robot config after this file, so the robot config values win.
# Tools that start nodes directly can give the robot config as a second --params-file.

trunk_detection_relay:
  ros__parameters:
    output_topic: trunk_measurements_raw

    use_trunk_width_addition: true

    min_trunk_width: 0.0
    required_class: 0
    min_depth: 0.3
    max_depth: 3.0
    side_class_skipping: ''  # near | far | '' (empty string to disable skipping)
    log_rejection_every_n_msgs: 3

    publish_debug_markers: true
    debug_marker_topic: trunk_measurements_raw_markers
    debug_marker_scale: 0.20



row_fast_slam:
  ros__parameters:
    num_particles: 3000
    measurement_topic: /trunk_measurements_raw
    odom_topic: /odometry/global   # trunk_to_template_pub.launch.py overrides this (launch arg slam_odom_topic)
    registry_topic: fastslam_registry
    odom_best_topic: odom_slam_best
 
    # Slot initialization (map init)
    slot_spacing: 1.42
    num_slots: 30
    exceed_slot_num: true
    max_extra_slots: 20  
    row_origin_s: 0.0
    slot_s_gate: 0.4
 
    row_origin_x: .nan
    row_origin_y: .nan
    row_dir_sign: -1
    row_yaw_init_window: 25
    min_seen_count_to_publish: 5
    use_template_map: true
    template_origin_from_first_measurement: true
    template_origin_min_hits: 5
    publish_unseen_template_landmarks: false
    use_global_row_yaw: true
 
    # Initial covariance - landmark uncertainty (meters, row frame)
    prior_sigma_s: 0.3
    prior_sigma_d: 0.2
 
    # Row-relative particle initialization
    init_sigma_s: 0.40
    init_sigma_d: 0.20
    init_sigma_yaw: 0.1
 
    landmark_init.include_pose_uncertainty: false   # false: pure FastSLAM. true: add the particle spread to the initial Sigma.
 
    # Local trunk associations
    assoc.per_particle: true
    max_back_assoc: 0
    max_fwd_assoc: 2
    widen_init_assoc: false
 
    # Trunk row side classification
    start_side: near
    init_d_near: 0.0
    init_d_far: 0.0
    side_mode: semantic
    semantic_side_min_votes: 3
    semantic_side_fallback: fixed
 
    # Measurement noise model
    meas_noise_model: polar   # "cartesian" | "polar"
 
    # Used when meas_noise_model: cartesian
    meas_std_y_lat: 0.5
    meas_std_x_fwd: 0.6
 
    # Used when meas_noise_model: polar
    meas_std_range:   0.10   # [m] range standard deviation
    meas_std_bearing: 0.1   # [rad] bearing standard deviation
 
    meas_fwd_gate: 1.2

    # Stationary measurement skip gate
    meas_skip.enable: false
    meas_skip.delta_range:   0.01   # [m] minimum range change for a weight update
    meas_skip.delta_bearing: 0.005   # [rad] minimum bearing change for a weight update
 
    # Motion distribution (robot frame)
    motion_noise.a_trans: 0.1   # [m] std per meter of travel
    motion_noise.b_trans: 0.08   # [m] std per radian of rotation
    motion_noise.c_lat: 0.08     # [m] std of lateral motion (slip)
    motion_noise.a_rot: 0.05    # [rad] std per radian of rotation
    motion_noise.b_rot: 0.08     # [rad] std per meter of travel
    motion_noise.x_floor: 0.005 # [m] minimum x noise (keeps the particles spread)
    motion_noise.y_floor: 0.005 # [m] minimum y noise (keeps the particles spread)
    motion_noise.yaw_floor: 0.001 # [rad] minimum yaw noise (keeps the particles spread)
 
    # Resampling
    resample_interval: 20
    neff_ratio_threshold: 0.35
    resample_burn_in: 20
    resample_neff_floor: 0.05   # resample below this neff ratio, also when no slot is committed

    # Roughening tiers after a resample (they apply when the neff ratio is below the threshold)
    resample_roughen.neff_moderate: 0.15        # neff ratio below which roughening starts
    resample_roughen.neff_severe: 0.05          # neff ratio for the severe / catastrophic tier
    resample_roughen.maha_catastrophic: 8.0    # Mahalanobis^2 above which the catastrophic tier applies
    resample_roughen.scale_moderate_xy: 3.0     # multiplier on motion noise std (moderate tier)
    resample_roughen.scale_severe_xy: 5.0       # multiplier on motion noise std (severe tier)
    resample_roughen.scale_severe_yaw: 3.0
    resample_roughen.catastrophic_xy_slots: 3.0 # xy spread = slot_spacing * this
    resample_roughen.catastrophic_yaw: 0.15     # [rad]
 
    # Median-particle innovation gate (Mahalanobis^2). Set <= 0 to disable.
    maha_gate_median: 6.0
    maha_gate_min_particles: 25
 
    # World-frame floor
    landmark_sigma_floor_x: 0.0
    landmark_sigma_floor_y: 0.0
 
    # Row-frame floor params
    landmark_sigma_floor_s: 0.01
    landmark_sigma_floor_d: 0.01
    landmark_process_noise_s: 0.004
    landmark_process_noise_d: 0.004
 
    # Merge neighboring associations
    publish_merge_duplicates.enable: false
    publish_merge_duplicates.dist_m: 0.1
    publish_merge_duplicates.only_adjacent: true
 
    # FastSLAM 2.0: pose proposal from the measurement
    proposal.enable: true
    proposal.min_pose_std_range:   0.003   # [m] range floor (limits along-row drift)
    proposal.min_pose_std_bearing: 0.003   # [rad] bearing floor (lateral correction)
    proposal.min_pose_std_yaw: 0.001   # [rad]
    proposal.max_correction_xy: 0.06    # [m] maximum pose correction per step
    proposal.max_correction_yaw: 0.04   # [rad] maximum pose correction per step
    proposal.zombie_maha_threshold: 20.0 # the proposal does not move particles with Mahalanobis^2 above this
    proposal.min_landmark_seen: 5 # observations a landmark needs for the proposal (below: standard update)
    proposal.max_odom_steps: 10 # cap on the odom steps that scale the pose prior uncertainty
 
    # Template soft prior (weight update per landmark)
    template_prior.enable: false
    template_prior.sigma_s: 0.4
    template_prior.sigma_d: 0.15
    template_prior.decay_k: 6.0
    template_prior.max_seen: 12
    template_prior.w: 0.05
 
    origin_recal.enable: true
    origin_recal.min_seen: 8
    origin_recal.alpha: 0.02
    origin_recal.interval: 15

    # Inter-landmark spacing propagation
    spacing_propagation.enable: false
    spacing_propagation.min_seen: 8     # detections a slot needs before it pushes to its neighbours
    spacing_propagation.max_unseen: 5   # a slot with more detections gets no push
    spacing_propagation.alpha: 0.05      # push strength per hop [0, 1]
    spacing_propagation.n_hops: 1       # neighbours in each direction
    spacing_propagation.consistency_sigma_frac: 0.3 # consistency sigma as a fraction of slot_spacing
    spacing_propagation.consistency_min_seen: 8 # observations a neighbour needs before it counts
    spacing_propagation.forward_only: true # push only forward (down the row)
 
    # Publish throttle
    publish.registry_min_interval: 0.1   # [s] (10 Hz)
    publish.odom_min_interval: 0.05      # [s] (20 Hz)
 
    # Message lag
    meas_max_lag_sec: 2.0
    odom_history_sec: 2.0
 
    # Debugging
    debug.csv_enable: true
    debug.log_every_n_meas: 0
    # Debug CSVs (+ _landmarks.csv, _tracks.csv), rewritten each run. Default: tree_template/debug_data/ in the
    # package source folder. Remove the # to set a different path (a robot config value wins over this file):
    # debug.csv_path: /path/to/debug_data/fastslam_debug.csv
    debug.csv_flush_every_n: 1
    debug.print_measurement_stamp: false

odom_reframer:
  ros__parameters:
    output_odom_topic: /odometry/wheel
    odom_frame: odom
    publish_tf: false

    recenter: true

    rotate_pos_deg: 180.0
    rotate_yaw_deg: 0.0
    rotate_orientation_only: false

    use_now_stamp: true
    copy_twist: true

    gps_min_status: 0
    gps_require_finite_cov: false

    initial_odom_samples: 25
    initial_gps_samples: 5

slam_odom_correction_tf:
  ros__parameters:
    wheel_odom_topic: /odometry/global
    slam_odom_topic: /odom_slam_best

    odom_frame: odom
    map_frame: map

    sync_queue_size: 50
    sync_slop_sec: 0.05
    sync_allow_headerless: false

    publish_rate_hz: 30.0
    publish_on_wheel_odom: true


tree_scene_node:
  ros__parameters:
    leader_branch_radii: 0.08
    leader_branch_len: 2.25
    num_side_branches: 4.0
    side_branch_radii: 0.04
    side_branch_len: 2.0
    side_branch_start_height: 0.75

    trellis_angle: -18.435
    branch_spacing: 0.5
    trellis_prefix: v_trellis_tree_

    registry_topic: fastslam_registry


save_best_particle_map:
  ros__parameters:
    trunk_topic: /fastslam_registry
    odom_corr_topic: /initial_odom_correction
    gps_topic: /initial_gps_fix

    require_odom_correction: true
    require_gps_fix: true
    require_trunks: true
    require_final_gps_fix: true
    final_gps_samples: 5

    service_name: save_slam_results


trellis_from_rgbd_extraction:
  ros__parameters:
    anchor_tree_id: -1
    trellis_side: far
    registry_topic: fastslam_registry
    shift_whole_map: false
    max_correction_m: 2.0
    measurement_timeout_sec: 5.0